<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Home — Venkatesh Dangi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg1: #0b1220;
            --bg2: #b6bfd4;
            --card: #182235;
            --border: #2a3550;
            --muted: #b8c4d9;
            --white: #f1f5ff;
            --accent: #7c5cff;
            --accent2: #4be6b1;
            --radius: 14px;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui;
            background: linear-gradient(180deg, var(--bg1), var(--bg2));
            color: var(--white);
            padding: 32px;
            display: flex;
            justify-content: center;
        }

        .wrap {
            width: 100%;
            max-width: 980px;
            background: rgba(255, 255, 255, 0.02);
            padding: 28px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        nav a {
            color: var(--muted);
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid transparent;
            font-weight: 600;
            font-size: 16px;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .avatar {
            width: 120px;
            height: 130px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c5cff, #4be6b1);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .card {
            background: var(--card);
            padding: 20px;
            font-size: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
    </style>

</head>

<body>
    <div class="wrap">

        <header>
            <div style="display:flex;align-items:center;gap:14px">
                <div class="avatar">
                    <img src="photo.jpg" alt="Profile Photo"
                        style="width:130%;height:120%;border-radius:10px;object-fit:cover;">

                </div>

                <div>
                    <h1 style="margin:0;font-size:20px;font-weight:700;">Venkatesh Dangi</h1>
                    <!-- <div style="color:var(--muted);font-size:13px">Solidity Smart Contract Developer</div> -->
                </div>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="resume.pdf" target="_blank">Resume</a>
                <a href="projects.html">Projects</a>
            </nav>
        </header>

        <section class="card">
            <h2 style="margin-top:0">Profile Summary</h2>
            <p style="color:var(--muted);line-height:1.6">
                Computer Science graduate with hands-on experience in Solidity smart contract development and
                Ethereum testnet deployments using Remix and MetaMask, including contract verification on
                Etherscan.
            </p>
        </section>

    </div>
</body>

</html>
